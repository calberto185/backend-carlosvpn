# .github/workflows/deploy.yml del repo backend-carlosvpn
name: Desplegar backend en el VPS
on:
  push:
    branches: [prod-VPN]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    uses: calberto185/infra-carlosvpn/.github/workflows/deploy-service.yml@v1
    with:
      service: backend
      tag_var: BACKEND_TAG
      health_url: https://vpn.carlosvm.me/health
    secrets: inherit
